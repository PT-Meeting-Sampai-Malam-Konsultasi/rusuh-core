# Local real-test infrastructure for rusuh-core (NOT a smoke test).
#
# What runs here (Docker) vs on the host:
#   Docker: Postgres 16, Valkey 7.2, LocalStack (SQS + SES + S3).
#   Host:   Dukcapil mock plus the 6 rusuh-core apps — see local-dev/README.md.
#
# Usage:
#   docker compose -f local-dev/docker-compose.yml up -d
#   bash local-dev/setup-env.sh        # writes apps/*/.env (local values + keys)
#   docker compose -f local-dev/docker-compose.yml down   # stop infra
#   docker compose -f local-dev/docker-compose.yml down -v  # also wipe data

name: rusuh-local

services:
  postgres:
    image: postgres:16
    container_name: rusuh-postgres
    environment:
      POSTGRES_DB: rusuh
      POSTGRES_USER: rusuh
      POSTGRES_PASSWORD: rusuh-dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONCE on first init (empty volume), in filename order. Each script
      # is its own file mount: Docker cannot create a mount point inside a
      # directory that is itself mounted read-only, so do not mount the folder.
      # Auth and core schemas come straight from their source files (one copy
      # to maintain); only payment keeps a local script.
      - ../apps/auth/db/migrations/001_auth.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
      - ../apps/auth/db/migrations/002_otp_challenge_no_full_name.sql:/docker-entrypoint-initdb.d/02-auth-otp-no-full-name.sql:ro
      - ../apps/auth/db/migrations/003_account_roles.sql:/docker-entrypoint-initdb.d/03-auth-account-roles.sql:ro
      - ../apps/core/src/infrastructure/persistence/schema.sql:/docker-entrypoint-initdb.d/04-core.sql:ro
      - ../apps/core/db/migrations/001_admin_schema_alignment.sql:/docker-entrypoint-initdb.d/05-core-admin-alignment.sql:ro
      - ../apps/core/db/migrations/002_queue_feed.sql:/docker-entrypoint-initdb.d/05-core-queue-feed.sql:ro
      - ./postgres-init/06-payment.sql:/docker-entrypoint-initdb.d/06-payment.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rusuh -d rusuh']
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:7.2
    container_name: rusuh-valkey
    command: valkey-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  localstack:
    image: localstack/localstack:3.8.1
    container_name: rusuh-localstack
    environment:
      SERVICES: sqs,ses,s3
      AWS_DEFAULT_REGION: ap-southeast-3
      # LocalStack needs no real credentials; the apps use test/test.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '4566:4566'
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 24

  # One-shot: creates the SQS queues (+ DLQs), the S3 bucket and the SES
  # sender identity once LocalStack is healthy. Exits 0 when done.
  localstack-init:
    image: amazon/aws-cli:latest
    container_name: rusuh-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-southeast-3
      AWS_ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./localstack-init.sh:/init.sh:ro
    entrypoint: ['sh', '/init.sh']

volumes:
  pgdata:
  valkeydata:
  localstack-data:
