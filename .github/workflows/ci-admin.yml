name: admin ci

# One pipeline per service: same shape as the rusuh-queue caller, so each
# app has its own run, its own history, and can be re-run alone.

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ci-admin.yml**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: PT-Meeting-Sampai-Malam-Konsultasi/rusuh-infra/.github/workflows/backend-ci.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      service: msmk-admin
      runtime: node
      runtime-version-file: .nvmrc
      working-directory: .
      setup: npm ci
      lint: npm run lint --workspace=@rusuh/admin-service
      test: npm test --workspace=@rusuh/admin-service
      vuln: npm audit --audit-level=high
      dockerfile: apps/admin/Dockerfile
      context: .
