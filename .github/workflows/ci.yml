name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    strategy:
      matrix:
        include:
          - app: auth
            package: '@rusuh/auth-service'
            image: msmk-auth
            ecs-service: msmk-prod-auth
            ecs-task-family: msmk-prod-auth
            ecs-container: auth
          - app: core
            package: '@rusuh/core-service'
            image: msmk-core
            ecs-service: msmk-prod-core
            ecs-task-family: msmk-prod-core
            ecs-container: core
          - app: payment
            package: '@rusuh/payment-service'
            image: msmk-payment
            ecs-service: msmk-prod-payment
            ecs-task-family: msmk-prod-payment
            ecs-container: payment
          - app: notification
            package: '@rusuh/notification-service'
            image: msmk-notification
            ecs-service: msmk-prod-notification
            ecs-task-family: msmk-prod-notification
            ecs-container: notification
          - app: officer
            package: '@rusuh/officer-service'
            image: msmk-officer
            ecs-service: msmk-prod-officer
            ecs-task-family: msmk-prod-officer
            ecs-container: officer
          - app: admin
            package: '@rusuh/admin-service'
            image: msmk-admin
            ecs-service: msmk-prod-admin
            ecs-task-family: msmk-prod-admin
            ecs-container: admin
    uses: PT-Meeting-Sampai-Malam-Konsultasi/rusuh-infra/.github/workflows/backend-ci.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      service: ${{ matrix.image }}
      runtime: node
      runtime-version-file: .nvmrc
      working-directory: .
      setup: npm ci
      lint: npm run lint --workspace=${{ matrix.package }}
      test: npm test --workspace=${{ matrix.package }}
      vuln: npm audit --audit-level=high
      dockerfile: apps/${{ matrix.app }}/Dockerfile
      context: .

  cd:
    needs: ci
    if: github.ref_type == 'tag'
    strategy:
      matrix:
        include:
          - app: auth
            package: '@rusuh/auth-service'
            image: msmk-auth
            ecs-service: msmk-prod-auth
            ecs-task-family: msmk-prod-auth
            ecs-container: auth
          - app: core
            package: '@rusuh/core-service'
            image: msmk-core
            ecs-service: msmk-prod-core
            ecs-task-family: msmk-prod-core
            ecs-container: core
          - app: payment
            package: '@rusuh/payment-service'
            image: msmk-payment
            ecs-service: msmk-prod-payment
            ecs-task-family: msmk-prod-payment
            ecs-container: payment
          - app: notification
            package: '@rusuh/notification-service'
            image: msmk-notification
            ecs-service: msmk-prod-notification
            ecs-task-family: msmk-prod-notification
            ecs-container: notification
          - app: officer
            package: '@rusuh/officer-service'
            image: msmk-officer
            ecs-service: msmk-prod-officer
            ecs-task-family: msmk-prod-officer
            ecs-container: officer
          - app: admin
            package: '@rusuh/admin-service'
            image: msmk-admin
            ecs-service: msmk-prod-admin
            ecs-task-family: msmk-prod-admin
            ecs-container: admin
    uses: PT-Meeting-Sampai-Malam-Konsultasi/rusuh-infra/.github/workflows/backend-cd.yml@v1
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      service: ${{ matrix.image }}
      environment: production
      ecs-service: ${{ matrix.ecs-service }}
      ecs-task-family: ${{ matrix.ecs-task-family }}
      ecs-container: ${{ matrix.ecs-container }}
